<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Guia Prático Olha e Volta — treinando cães reativos e distraídos.">
<title>Guia Prático — Olha e Volta</title>
<style>
:root{--g:#405a22;--gd:#304617;--bg:#f7f7f1;--text:#222;--muted:#665f4f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
.wrap{width:min(920px,calc(100% - 28px));margin:28px auto 50px}
.card{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 12px 35px rgba(0,0,0,.10)}
.guide{display:block;width:100%;height:auto}
.cta{padding:34px 24px 38px;text-align:center;background:linear-gradient(180deg,#f8f7f2,#eef0df);border-top:1px solid rgba(64,90,34,.12)}
.cta h2{margin:0 0 10px;color:var(--gd);font-size:clamp(24px,4vw,34px);line-height:1.15}
.cta p{max-width:650px;margin:0 auto 22px;color:var(--muted);font-size:17px;line-height:1.55}
.btn{display:inline-block;padding:15px 25px;border-radius:10px;background:var(--g);color:#fff;text-decoration:none;font-weight:700;font-size:16px;box-shadow:0 7px 18px rgba(64,90,34,.22)}
.btn:hover{background:var(--gd)}
.small{margin-top:13px;font-size:13px;color:#777}
</style>
</head>
<body>
<main class="wrap">
<section class="card">
<img class="guide" src="https://canilmeucaoeducado.github.io/meucaoeducadov3/@vetadestradordiego.png" alt="Guia Prático Olha e Volta — treinando cães reativos e distraídos">
<div class="cta">
<h2>Quer ter um cão mais calmo e obediente?</h2>
<p>No Programa Meu Cão Educado, você vai aprender comigo o que fazer no dia a dia para construir bons comportamentos no seu cão, com treinos curtos de 10 minutos.</p>
<a class="btn" href="https://canilmeucaoeducado.github.io/meucaoeducado/" target="_blank" rel="noopener">QUERO MEU CÃO MAIS CALMO E OBEDIENTE</a>
<div class="small">Programa Meu Cão Educado · Diego Lima</div>
</div>
</section>
</main>
</body>
</html>
